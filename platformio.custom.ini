;
; global custom
;
[custom]
build_flags =
  -I lib/OGM-HardwareConfig/include
  -D OPENKNX_MAX_LOG_MESSAGE_LENGTH=1024
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG

[custom_release]
extends = custom
build_flags =
  ${custom.build_flags}

[custom_ip]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE
  -D OPENKNX_WEBMONITOR

[ESP32_custom]
extends = ESP32, custom
build_flags =
  ${ESP32.build_flags}
  -D SERIAL_DEBUG=Serial

[custom_develop_ESP32]
extends = ESP32_develop, custom_develop, ESP32_custom
build_flags =
  ${ESP32_develop.build_flags}
  ${custom_develop.build_flags}
  ${ESP32_custom.build_flags}

[custom_release_ESP32]
extends = ESP32_releases, custom_release, ESP32_custom
build_flags =
  ${ESP32_releases.build_flags}
  ${custom_release.build_flags}
  ${ESP32_custom.build_flags}

; XIAO ESP32-S3 + SX1262
[board_OpenKNX_XIAO_S3_SX1262]
extends = ESP32_8MB
board = seeed_xiao_esp32s3
build_flags =
  -D OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1
  -D RADIO_SX1262
  -D IOHC_RADIO_TCXO_VOLTAGE=0x00
  -D IOHC_RADIO_TCXO_DELAY_US=5000UL
  -D IOHC_SPI_SCK=7
  -D IOHC_SPI_MISO=8
  -D IOHC_SPI_MOSI=9
  -D IOHC_SPI_CS=41
  -D IOHC_RADIO_RST=42
  -D IOHC_RADIO_DIO1=39
  -D IOHC_RADIO_BUSY=40
  -D IOHC_RADIO_RF_SW=38

; XIAO ESP32-S3 + SX1276
[board_OpenKNX_XIAO_S3_SX1276]
extends = ESP32_8MB
board = seeed_xiao_esp32s3
build_flags =
  -D OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1
  -D RADIO_SX1276
  -D IOHC_SPI_SCK=7 ; XIAO D8 = GPIO7 = SPI SCK
  -D IOHC_SPI_MISO=8 ; XIAO D9 = GPIO8 = SPI MISO
  -D IOHC_SPI_MOSI=9 ; XIAO D10 = GPIO9 = SPI MOSI
  -D IOHC_SPI_CS=5 ; XIAO D4 = GPIO5 = SPI CS
  -D IOHC_RADIO_RST=4 ; XIAO D3 = GPIO4 = SX1276 RESET
  -D IOHC_RADIO_DIO0=2 ; XIAO D1 = GPIO2 = SX1276 DIO0
  -D IOHC_RADIO_DIO4=3 ; XIAO D2 = GPIO3 = SX1276 DIO4 / optional IRQ

; ESP32-S3 dev board + SX1276 (wired radio module)
[board_OpenKNX_ESP32_S3_DEV_SX1276]
extends = ESP32_8MB
board = esp32-s3-devkitc-1
build_flags =
  -D RADIO_SX1276
  -D IOHC_SPI_SCK=14 ; IO14 = SPI SCK
  -D IOHC_SPI_MISO=15 ; IO15 = SPI MISO / RX
  -D IOHC_SPI_MOSI=13 ; IO13 = SPI MOSI / TX
  -D IOHC_SPI_CS=12 ; IO12 = SPI CS
  -D IOHC_RADIO_RST=8 ; IO8 = SX1276 RESET
  -D IOHC_RADIO_DIO0=7 ; IO7 = SX1276 DIO0
  -D IOHC_RADIO_DIO4=20 ; IO20 = SX1276 DIO1 / optional IRQ

; REG1-IPTPControllerESP-DevBoard v00.11 + SX1276
[board_OpenKNX_REG1_ESP_V00_11_SX1276]
extends = ESP32_8MB
build_flags =
  -D DEVICE_DEV_REG1_LAN_TP_Base_V00_11
  -D RADIO_SX1276
  -D RADIO_SX1276
  -DIOHC_SPI_SCK=REG1_APP_PIN4 ; REG1_APP_PIN4 = IO14 = SPI SCK
  -DIOHC_SPI_MISO=REG1_APP_PIN2 ; REG1_APP_PIN2 = IO15 = SPI MISO / RX
  -DIOHC_SPI_MOSI=REG1_APP_PIN3 ; REG1_APP_PIN3 = IO13 = SPI MOSI / TX
  -DIOHC_SPI_CS=REG1_APP_PIN1 ; REG1_APP_PIN1 = IO12 = SPI CS
  -DIOHC_RADIO_RST=REG1_APP_PIN5 ; REG1_APP_PIN5 = IO8  = SX1276 RESET
  -DIOHC_RADIO_DIO0=REG1_APP_PIN6 ; REG1_APP_PIN6 = IO7  = SX1276 DIO0
  -DIOHC_RADIO_DIO4=REG1_APP_PIN7 ; REG1_APP_PIN7 = IO20 = SX1276 DIO1 / optional IRQ

;REG1_APP_PIN1 = IO12 = RTC_GPIO15/MTDI
;REG1_APP_PIN2 = IO15 = RTC_GPIO13/MTDO
;REG1_APP_PIN3 = IO13 = RTC_GPIO14/MTCK
;REG1_APP_PIN4 = IO14 = RTC_GPIO16/MTMS
;REG1_APP_PIN5 = IO8  = RTC_GPIO8
;REG1_APP_PIN6 = IO7  = RTC_GPIO7
;REG1_APP_PIN7 = IO20 = RTC_GPIO20

[env:develop_OpenKNX_XIAO_S3_SX1262_TP]
extends = custom_develop_ESP32, board_OpenKNX_XIAO_S3_SX1262
build_flags =
  ${KNX_TP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1262.build_flags}
  ${custom_develop_ESP32.build_flags}

[env:release_OpenKNX_XIAO_S3_SX1262_TP]
extends = custom_release_ESP32, board_OpenKNX_XIAO_S3_SX1262
build_flags =
  ${KNX_TP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1262.build_flags}
  ${custom_release_ESP32.build_flags}

[env:develop_OpenKNX_XIAO_S3_SX1262_IP]
extends = custom_develop_ESP32, board_OpenKNX_XIAO_S3_SX1262
build_flags =
  ${KNX_IP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1262.build_flags}
  ${custom_develop_ESP32.build_flags}
  ${custom_ip.build_flags}
  -D KNX_IP_WIFI
  -D ARDUINO_SEEED_XIAO_ESP32S3

[env:develop_OpenKNX_XIAO_S3_SX1276_IP]
extends = custom_develop_ESP32, board_OpenKNX_XIAO_S3_SX1276
build_flags =
  ${KNX_IP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1276.build_flags}
  ${custom_develop_ESP32.build_flags}
  ${custom_ip.build_flags}
  -D KNX_IP_WIFI
  -D ARDUINO_SEEED_XIAO_ESP32S3

[env:release_OpenKNX_XIAO_S3_SX1276_TP]
extends = custom_release_ESP32, board_OpenKNX_XIAO_S3_SX1276
build_flags =
  ${KNX_TP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1276.build_flags}
  ${custom_release_ESP32.build_flags}
  ;-D KNX_UART_NUM=0
  ;-D KNX_UART_RX_PIN=44 ; XIAO D7 = GPIO44 = RX from BCU TX
  ;-D KNX_UART_TX_PIN=43 ; XIAO D6 = GPIO43 = TX to BCU RX

[env:develop_OpenKNX_XIAO_S3_SX1276_TP]
extends = custom_develop_ESP32, board_OpenKNX_XIAO_S3_SX1276
build_flags =
  ${KNX_TP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1276.build_flags}
  ${custom_develop_ESP32.build_flags}
  ;-D KNX_UART_NUM=0
  ;-D KNX_UART_RX_PIN=44 ; XIAO D7 = GPIO44 = RX from BCU TX
  ;-D KNX_UART_TX_PIN=43 ; XIAO D6 = GPIO43 = TX to BCU RX

[env:develop_OpenKNX_ESP32_S3_DEV_SX1276_IP]
extends = custom_develop_ESP32, board_OpenKNX_ESP32_S3_DEV_SX1276
build_flags =
  ${KNX_IP.build_flags}
  ${board_OpenKNX_ESP32_S3_DEV_SX1276.build_flags}
  ${custom_develop_ESP32.build_flags}
  ${custom_ip.build_flags}
  -D PROG_LED_PIN=-1
  -D PROG_LED_PIN_ACTIVE_ON=HIGH
  -D KNX_IP_WIFI
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:release_OpenKNX_XIAO_S3_SX1262_IP]
extends = custom_release_ESP32, board_OpenKNX_XIAO_S3_SX1262
build_flags =
  ${KNX_IP.build_flags}
  ${board_OpenKNX_XIAO_S3_SX1262.build_flags}
  ${custom_release_ESP32.build_flags}
  ${custom_ip.build_flags}
  -D KNX_IP_WIFI

[env:develop_OpenKNX_REG1_ESP_V00_11_SX1276_TP]
extends = custom_develop_ESP32, board_OpenKNX_REG1_ESP_V00_11_SX1276
build_flags =
  ${KNX_TP.build_flags}
  ${board_OpenKNX_REG1_ESP_V00_11_SX1276.build_flags}
