on: [push, pull_request]

jobs:
  ofm-pin:
    name: Verify the pinned OFM dependency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the pinned OFM revision
        id: ofm
        run: |
          revision="$(python3 tools/check-ofm-pin.py --print-ref)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenKNX/OFM-IOHomeControl
          ref: ${{ steps.ofm.outputs.revision }}
          path: _ci/ofm
          persist-credentials: false
      - run: python3 tools/check-ofm-pin.py --checkout _ci/ofm

  check:
    name: Check '${{ matrix.target }}' in '${{ matrix.oam }}'
    strategy:
      fail-fast: false
      matrix:

        # [BUILD]: all build targets
        target:
          # NO Release XML present; - -Release
          - ""

        # [REF]: same commit and (newest on) branch
        restore_branch:
          - false
          - true

    uses: openknx/actions/.github/workflows/openknx-oam-check.yml@v0
    with:
      # oam: use this repo as default --> OAM-IOHomeControl
      oam_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      restore_branch: ${{ matrix.restore_branch }}
      target: ${{ matrix.target }}
      KNXPROD_PREFIX: IoHomecontrol
